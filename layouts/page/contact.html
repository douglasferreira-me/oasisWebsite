{{ define "main" }}<header class="page-hero"><div class="container"><p class="eyebrow">{{ .Params.eyebrow }}</p><h1>{{ .Title }}</h1><p class="lead">{{ .Params.description }}</p></div></header><section class="section"><div class="container contact-grid"><article class="prose">{{ .Content }}</article><aside class="contact-panel"><ul class="contact-list"><li><strong>{{ .Params.emailLabel }}</strong><br><a href="mailto:{{ .Params.email }}">{{ .Params.email }}</a></li><li><strong>{{ .Params.socialLabel }}</strong><div class="contact-socials"><a href="{{ hugo.Data.social.instagram.url }}" target="_blank" rel="noopener noreferrer">{{ hugo.Data.social.instagram.label }} →</a><a href="{{ hugo.Data.social.linkedin.url }}" target="_blank" rel="noopener noreferrer">{{ hugo.Data.social.linkedin.label }} →</a></div></li></ul></aside></div></section>{{ end }}
